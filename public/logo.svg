<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#d5d5d8" stroke-width="1.2"/>
    </pattern>
  </defs>
  <!-- Outer Frame & Grid Background -->
  <rect width="300" height="220" fill="#f4f4f5" rx="8" />
  <rect width="300" height="220" fill="url(#grid)" rx="8" />
  
  <!-- YS Monogram -->
  <text 
    x="150" 
    y="120" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Helvetica Neue', sans-serif" 
    font-size="110" 
    font-weight="900" 
    letter-spacing="-2px" 
    fill="#09090b"
  >YS</text>
</svg>
